name: CI pipeline for Tea

on:
  push:
    branches:
      - staging

jobs:
  build:
    runs-on: [self-hosted, windows]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: yarn install

      - name: Build project
        run: yarn build

      - name: Deploy to IIS
        run: |
          $ErrorActionPreference = "Stop"
          $siteName = "TeaLandingPage"
          $target = "C:\inetpub\wwwroot\$siteName"

          # Xác định thư mục build output (thay đổi theo cấu hình của bạn)
          $buildOutput = ".\out"  # Hoặc ".\.next" nếu dùng SSR

          if (-Not (Test-Path $buildOutput)) {
            Write-Error "Build output directory '$buildOutput' not found!"
            exit 1
          }

          Stop-Website -Name $siteName
          Remove-Item "$target\*" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item "$buildOutput\*" -Destination $target -Recurse -Force
          Start-Website -Name $siteName
        shell: powershell
