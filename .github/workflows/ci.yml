name: CI pipeline for Tea

on:
  push:
    branches:
      - staging

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            rm -rf ~/vanthang_deploy
            mkdir -p ~/vanthang_deploy

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "out/*"
          target: "~/vanthang_deploy/"
          strip_components: 1
          overwrite: true

      - name: Move files to web root with sudo
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo '${{ secrets.SSH_PASSWORD }}' | sudo -S rm -rf /var/www/vanthang.vn/*
            echo '${{ secrets.SSH_PASSWORD }}' | sudo -S mkdir -p /var/www/vanthang.vn
            echo '${{ secrets.SSH_PASSWORD }}' | sudo -S cp -r ~/vanthang_deploy/* /var/www/vanthang.vn/
            echo '${{ secrets.SSH_PASSWORD }}' | sudo -S chown -R www-data:www-data /var/www/vanthang.vn
            echo '${{ secrets.SSH_PASSWORD }}' | sudo -S chmod -R 755 /var/www/vanthang.vn
            rm -rf ~/vanthang_deploy
